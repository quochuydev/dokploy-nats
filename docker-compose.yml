services:
  nats:
    image: nats:2.10.24-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    expose:
      - "4222"
      - "8222"
      - "8080"
    environment:
      NATS_SERVER_NAME: ${NATS_SERVER_NAME}
      NATS_AUTH_TOKEN: ${NATS_AUTH_TOKEN}
      NATS_HTTP_PORT: ${NATS_HTTP_PORT}
      NATS_WS_PORT: ${NATS_WS_PORT}
      NATS_MAX_PAYLOAD: ${NATS_MAX_PAYLOAD}
      NATS_MAX_CONNECTIONS: ${NATS_MAX_CONNECTIONS}
      NATS_JS_MAX_MEMORY: ${NATS_JS_MAX_MEMORY}
      NATS_JS_MAX_FILE: ${NATS_JS_MAX_FILE}
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nats-data:
